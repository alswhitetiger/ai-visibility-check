name = "ai-visibility"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 프론트(GitHub Pages) 주소. CORS 허용 대상.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://alswhitetiger.github.io"
DAILY_SCAN_LIMIT = "400"
IP_DAILY_LIMIT = "5"
CACHE_TTL_HOURS = "24"

# 사용할 모델. API 결제를 연결하면 상위 모델로 바꾼다.
# 무료 티어에서 gemini-3.5-flash 이상은 503(수요 폭주), pro 계열은 429(결제 필요)가 난다.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# D1 바인딩. `wrangler d1 create ai-visibility` 실행 후 id를 채운다.
[[d1_databases]]
binding = "DB"
database_name = "ai-visibility"
database_id = "92c0a136-cec9-43f0-98be-a15b79f0cf01"

# 아래 키는 절대 이 파일에 쓰지 않는다. secret으로만 등록한다.
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# 심사위원 우회 코드도 secret 으로 둔다. 공개 저장소에 값을 남기지 않기 위해서다.
#   npx wrangler secret put JUDGE_CODE
